<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - QuickBite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-utensils"></i> QuickBite</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html" class="cart-link">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a></li>
      </ul>
    </div>
  </nav>

  <section class="checkout-page">
    <h2 class="section-title">Checkout</h2>

    <div class="checkout-grid">
      <form class="checkout-form" id="checkoutForm">
        <h3>Delivery Details</h3>

        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="name" required placeholder="Ali Ahmed">
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="phone" required placeholder="03001234567">
          <small class="error" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label>Address *</label>
          <textarea id="address" required placeholder="House #, Street, Area, City"></textarea>
          <small class="error" id="addressError"></small>
        </div>

        <div class="form-group">
          <label>Payment Method *</label>
          <select id="payment">
            <option value="cod">Cash on Delivery</option>
            <option value="card">Credit/Debit Card</option>
            <option value="easypaisa">EasyPaisa</option>
            <option value="jazzcash">JazzCash</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Place Order <i class="fas fa-check"></i>
        </button>
      </form>

      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="orderItems"></div>
        <div class="summary-row total"><span>Total:</span><span id="finalTotal">Rs. 0</span></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 QuickBite. All rights reserved.</p>
  </footer>

  <script src="data.js"></script>
  <script src="cart.js"></script>
</body>
</html>
