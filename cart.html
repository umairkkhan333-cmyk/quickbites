<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - QuickBite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><i class="fas fa-utensils"></i> QuickBite</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html" class="cart-link active">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a></li>
      </ul>
    </div>
  </nav>

  <section class="cart-page">
    <h2 class="section-title">Your Cart</h2>

    <div id="cartContainer"></div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="summary-row"><span>Subtotal:</span><span id="subtotal">Rs. 0</span></div>
      <div class="summary-row"><span>Delivery Fee:</span><span>Rs. 100</span></div>
      <div class="summary-row"><span>Tax (5%):</span><span id="tax">Rs. 0</span></div>
      <div class="summary-row total"><span>Total:</span><span id="total">Rs. 0</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout <i class="fas fa-arrow-right"></i></a>
    </div>

    <div class="empty-cart" id="emptyCart">
      <i class="fas fa-shopping-bag"></i>
      <h3>Your cart is empty</h3>
      <p>Add some delicious food to get started!</p>
      <a href="menu.html" class="btn btn-primary">Browse Menu</a>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 QuickBite. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
